<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LOAN BÌNH ĐỒ MÚA — Order Taobao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg:#f5f3f0;--card:#fff;--ink:#211d1a;--mut:#6f6760;--line:#e6e0d9;--acc:#d2461f;--acc2:#e8722a;--ok:#1f7a4d;--bad:#b3261e;--warn:#a35d00;--grad:linear-gradient(120deg,#d2461f,#e8722a)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #f3c6b2;border-color:var(--acc)}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px;font-weight:600}
h2{font-size:17px}h3{font-size:14px}
.money{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{color:var(--mut)} .bad{color:var(--bad)} .ok{color:var(--ok)} .warn{color:var(--warn)}
/* layout */
#app{display:none;min-height:100vh}
.side{position:fixed;left:0;top:0;bottom:0;width:216px;background:#171c2e;color:#cfd6ea;display:flex;flex-direction:column;padding:16px 10px;z-index:40}
.side .logo{font-weight:800;font-size:16px;color:#fff;padding:4px 10px 2px}
.side .sub{font-size:11px;color:#8b96b5;padding:0 10px 14px}
.nav button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:#cfd6ea;padding:11px 12px;border-radius:12px;font-size:14px;font-weight:600;text-align:left;margin-bottom:2px}
.nav button.on{background:var(--grad);color:#fff}
.nav button:hover:not(.on){background:#232a44}
.side .foot{margin-top:auto;padding:10px}
.main{margin-left:216px;padding:18px 20px 90px;max-width:1180px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.topbar h2{margin-right:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi .lb{font-size:12px;color:var(--mut);font-weight:600}
.kpi .vl{font-size:21px;font-weight:800;margin-top:4px}
.kpi.grad{background:var(--grad);color:#fff;border:0}.kpi.grad .lb{color:#ffe3d3}
.btn{background:var(--grad);color:#fff;border:0;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px}
.btn:disabled{opacity:.55;cursor:wait}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink);padding:9px 14px;border-radius:12px;font-weight:600}
.btn-red{background:#fdecec;border:1px solid #f5c2c4;color:var(--bad);padding:9px 14px;border-radius:12px;font-weight:600}
.btn-ok{background:#e5f7f0;border:1px solid #bfe9d8;color:#067a54;padding:9px 14px;border-radius:12px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:999px;font-weight:600;font-size:13px}
.chip.on{background:var(--grad);color:#fff;border:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{ text-align:left;color:var(--mut);font-size:12px;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tblwrap{overflow-x:auto}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-cho{background:#fdf0e0;color:#9a6206}.b-xl{background:#e6e9ff;color:#3d4fc4}.b-giao{background:#ddf5ea;color:#067a54}.b-huy{background:#fde3e3;color:#b3261e}
.b-order{background:#fbeee8;color:#d2461f}.b-san{background:#e4eefa;color:#1f5fa8}
.grid2{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.pc:hover{border-color:var(--acc)}
.pc .im{height:110px;background:#fbeee8;display:flex;align-items:center;justify-content:center;font-size:30px;color:#dfa98f}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .b{padding:9px 10px}
.pc .cd{font-size:11px;color:var(--acc);font-weight:800}
.pc .nm{font-weight:600;font-size:13px;line-height:1.3;min-height:34px}
.pc .pr{font-weight:800;margin-top:2px}
.pc .st{font-size:12px;color:var(--mut)}
.cart-line{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.cart-line .inf{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:800}
.qty input{width:46px;text-align:center;padding:5px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.modal{position:fixed;inset:0;background:rgba(15,18,30,.55);display:none;align-items:flex-start;justify-content:center;z-index:80;overflow-y:auto;padding:18px 10px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:18px;max-width:640px;width:100%;padding:20px;margin:auto}
.mbox.wide{max-width:820px}
.mhead{display:flex;align-items:center;margin-bottom:12px}.mhead h3{margin-right:auto;font-size:16px}
.x{border:0;background:#f0f2f8;width:32px;height:32px;border-radius:10px;font-size:15px}
.optgrid{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.opt{border:1.5px solid var(--line);background:#fff;padding:8px 14px;border-radius:999px;font-weight:600}
.opt.on{background:var(--grad);color:#fff;border-color:transparent}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#211d1a;color:#fff;padding:11px 18px;border-radius:12px;z-index:200;display:none;max-width:92vw;text-align:center;font-weight:600}
#pinScr{position:fixed;inset:0;background:linear-gradient(140deg,#57260f,#211d1a);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px}
.pincard{background:#fff;border-radius:22px;padding:28px 24px;max-width:360px;width:100%;text-align:center}
.pincard .lg{font-size:40px}
.pincard h1{font-size:19px;margin:8px 0 2px}
.bars{display:flex;gap:6px;align-items:flex-end;height:110px;margin-top:8px}
.bar{flex:1;background:var(--grad);border-radius:6px 6px 0 0;min-height:3px;position:relative}
.bar span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut);white-space:nowrap}
.bar em{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--mut);font-style:normal}
/* hoa don */
#bill{font-size:13.5px;color:#111}
#bill h2{font-size:19px;text-align:center}
#bill .c{text-align:center}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
@media(max-width:700px){
 .side{display:none}
 .main{margin-left:0;padding:12px 10px 96px}
 .bnav{position:fixed;left:0;right:0;bottom:0;background:#211d1a;display:flex;z-index:50;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
 .bnav button{flex:1;background:none;border:0;color:#aeb8d2;font-size:10.5px;font-weight:600;padding:5px 0 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
 .bnav button .ic{font-size:19px}
 .bnav button.on{color:#fff}
 .prods{grid-template-columns:repeat(2,1fr)}
 .kpis{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:701px){.bnav{display:none}}
@media print{
 body>*{display:none!important}
 .modal.on{position:static;display:block!important;background:none;padding:0}
 .modal.on .mbox{box-shadow:none;max-width:none;width:100%}
 .noprint{display:none!important}
 @page{size:A4 portrait;margin:10mm}
}
</style>
</head>
<body>

<div id="pinScr">
  <div class="pincard">
    <div class="lg">🛍️</div>
    <h1>LOAN BÌNH ĐỒ MÚA</h1>
    <p class="mut" style="margin-bottom:16px">Quản lý order Taobao — nhập mã PIN để vào</p>
    <form id="pinForm">
      <input id="pinInp" type="password" inputmode="numeric" placeholder="Mã PIN" style="text-align:center;font-size:18px;letter-spacing:3px" autocomplete="off">
      <p id="pinMsg" class="bad" style="min-height:20px;margin:8px 0"></p>
      <button class="btn" style="width:100%" id="pinBtn">Vào cửa hàng</button>
    </form>
    <p class="mut" style="font-size:12px;margin-top:14px">Trang mới theo mẫu Bảo Ân — dữ liệu dùng chung với web cũ, web cũ vẫn hoạt động bình thường.</p>
  </div>
</div>

<div id="app">
  <aside class="side">
    <div class="logo">🛍️ LOAN BÌNH</div>
    <div class="sub">ĐỒ MÚA • ORDER TAOBAO</div>
    <nav class="nav" id="navSide"></nav>
    <div class="foot"><button class="btn-ghost" id="btnOut" style="width:100%">🔒 Khoá màn hình</button></div>
  </aside>
  <main class="main" id="main"></main>
  <nav class="bnav" id="navBot"></nav>
</div>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="imgFile" accept="image/*" style="display:none">

<script>
'use strict';
/* ====== ket noi may chu cu (Hangle) — KHONG dung vao Sheet, chi goi API san co ====== */
const API_URL='https://script.google.com/macros/s/AKfycbwCYciJNmhKL-8ppfcZ8STvZZVGOrk4OryDcraUJ4ov0oOV3VsZDD97alXlEZ4zxgbuHw/exec';
let PIN=localStorage.getItem('tb_pin')||'';
function rpc(fn,...args){
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:[...args,PIN]})})
    .then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error||'Lỗi máy chủ');return j.data;})
    .catch(e=>{throw new Error(e.message||'Không kết nối được máy chủ');});
}
/* ====== tien ich ====== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>\u0022]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\u0022':'&quot;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/[^\d.-]/g,''));return isNaN(n)?0:n;};
const money=v=>Math.round(num(v)).toLocaleString('vi-VN');
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
function toast(msg,ok){const t=$('toast');t.textContent=msg;t.style.background=ok===false?'#b3261e':'#171c2e';t.style.display='block';setTimeout(()=>t.style.display='none',3400);}
function todayISO(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function shiftISO(days){const d=new Date();d.setDate(d.getDate()+days);return todayISO(d);}
let D=null; // init data: customers, products, stock, colors, sizes, nextOrder, today
const prodBy=code=>D?D.products.find(p=>p.code===code):null;
const custByCode=code=>D?D.customers.find(c=>c.code===code):null;
function openModal(html,wide){$('mbox').className='mbox'+(wide?' wide':'');$('mbox').innerHTML=html;$('modal').classList.add('on');}
function closeModal(){$('modal').classList.remove('on');}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
function mHead(t){return `<div class="mhead"><h3>${esc(t)}</h3><button class="x" onclick="closeModal()">✕</button></div>`;}
/* ====== dieu huong ====== */
const PAGES=[
 ['dash','📊','Tổng quan'],['new','🛒','Tạo đơn'],['orders','📦','Đơn hàng'],['web','🌐','Đơn online'],
 ['prods','👗','Hàng hoá'],['stock','🏷️','Tồn kho'],['import','📥','Nhập hàng về'],['rate','💱','Tỷ giá'],['custs','👥','Khách hàng']];
let CUR='dash';
let NAVSEQ=0; // moi lan chuyen trang +1; trang nao tai xong ma da cu thi khong ve de trang khac
function buildNav(){
  $('navSide').innerHTML=PAGES.map(p=>`<button data-pg="${p[0]}" class="${CUR===p[0]?'on':''}">${p[1]} ${p[2]}</button>`).join('');
  const bot=[PAGES[0],PAGES[1],PAGES[2],PAGES[4],PAGES[5]];
  $('navBot').innerHTML=bot.map(p=>`<button data-pg="${p[0]}" class="${CUR===p[0]?'on':''}"><span class="ic">${p[1]}</span>${p[2]}</button>`).join('')
    +`<button data-pg="more" class="${['web','import','rate','custs'].includes(CUR)?'on':''}"><span class="ic">☰</span>Thêm</button>`;
  document.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>go(b.dataset.pg));
}
function go(pg){
  if(pg==='more'){openModal(mHead('Mục khác')+`<div style="display:grid;gap:8px">${[['web','🌐 Đơn online'],['import','📥 Nhập hàng về'],['rate','💱 Tỷ giá'],['custs','👥 Khách hàng']].map(x=>`<button class="btn-ghost" style="text-align:left;padding:13px" onclick="closeModal();go('${x[0]}')">${x[1]}</button>`).join('')}</div>`);return;}
  CUR=pg;buildNav();
  ({dash:pgDash,new:pgNew,orders:pgOrders,web:pgWeb,prods:pgProds,stock:pgStock,import:pgImport,rate:pgRate,custs:pgCusts})[pg]();
}
function head(t,extra){return `<div class="topbar"><h2>${esc(t)}</h2>${extra||''}</div>`;}
async function refreshInit(){D=await rpc('getInitData');}
/* ====== dang nhap PIN ====== */
$('pinForm').onsubmit=async e=>{
  e.preventDefault();const v=$('pinInp').value.trim();if(!v)return;
  $('pinBtn').disabled=true;$('pinMsg').textContent='';
  PIN=v;
  try{D=await rpc('getInitData');localStorage.setItem('tb_pin',PIN);enterApp();}
  catch(err){$('pinMsg').textContent=/PIN/i.test(err.message)?'Sai mã PIN — thử lại nhé.':('Lỗi: '+err.message);PIN='';}
  $('pinBtn').disabled=false;
};
function enterApp(){$('pinScr').style.display='none';$('app').style.display='block';buildNav();go('dash');}
$('btnOut').onclick=()=>{localStorage.removeItem('tb_pin');PIN='';location.reload();};
if(PIN){(async()=>{try{D=await rpc('getInitData');enterApp();}catch(e){PIN='';localStorage.removeItem('tb_pin');}})();}

/* ================= TONG QUAN ================= */
let DASH=null;
async function pgDash(){
  const seq=++NAVSEQ;
  $('main').innerHTML=head('Tổng quan',`<button class="btn-ghost" onclick="pgDash()">↻ Làm mới</button>`)+'<div class="card">Đang tải…</div>';
  try{
    const [d]=await Promise.all([rpc('getDashboard',new Date().getFullYear()),D?Promise.resolve():refreshInit()]);
    if(seq!==NAVSEQ)return;
    DASH=d;
    const t=d.todayStat,m=d.month,pm=d.prevMonth,o=d.open;
    const choVe=(D.stock||[]).filter(x=>num(x.qty)<0).reduce((s,x)=>s+(-num(x.qty)),0);
    const delta=(a,b)=>{if(!b)return'';const p=Math.round((a-b)/Math.abs(b)*100);return `<div class="mut" style="font-size:12px">${p>=0?'▲':'▼'} ${Math.abs(p)}% so tháng trước</div>`;};
    const kpi=(lb,vl,sub,grad)=>`<div class="kpi${grad?' grad':''}"><div class="lb">${lb}</div><div class="vl">${vl}</div>${sub||''}</div>`;
    const max=Math.max(...d.months.map(x=>num(x.revenue)),1);
    $('main').innerHTML=head('Tổng quan',`<span class="mut">Hôm nay • ${esc(d.today)}</span>`)+`
    <div class="kpis">
      ${kpi('Doanh thu tháng '+esc(d.monthLabel),money(m.revenue)+'đ',delta(m.revenue,pm.revenue),1)}
      ${kpi('Lợi nhuận tháng',money(m.profit)+'đ',delta(m.profit,pm.profit))}
      ${kpi('Lãi gộp',money(m.gross)+'đ')}
      ${kpi('Chi phí tháng',money(m.expense)+'đ')}
      ${kpi('Đơn hôm nay',t.orders,`<div class="mut" style="font-size:12px">Giá trị ${money(t.value)}đ</div>`)}
      ${kpi('Hàng chờ về (đã bán, chưa có kho)',choVe+' cái',`<div class="mut" style="font-size:12px">${d.shortCount} màu/size cần đặt Taobao</div>`)}
      ${kpi('Đơn chờ hàng',o.waiting,`<div class="mut" style="font-size:12px">${money(o.waitingValue)}đ</div>`)}
      ${kpi('Đơn đang xử lý',o.processing,`<div class="mut" style="font-size:12px">${money(o.processingValue)}đ</div>`)}
      ${kpi('Khách còn nợ',money(d.debtTotal)+'đ',`<div class="mut" style="font-size:12px">${d.debtCount} khách</div>`)}
      ${kpi('Tổng tồn kho',d.stockQty+' cái')}
      ${kpi('Tỷ giá mới nhất',d.rate?money(d.rate.rate)+'đ':'—',d.rate?`<div class="mut" style="font-size:12px">ngày ${esc(d.rate.date)}</div>`:'')}
      ${kpi('Đã giao hôm nay',t.delivered)}
    </div>
    <div class="card"><h3>Doanh thu theo tháng — ${d.year}</h3>
      <div class="bars">${d.months.map((x,i)=>`<div class="bar" style="height:${Math.max(3,Math.round(num(x.revenue)/max*100))}%"><span>${num(x.revenue)?money(x.revenue):''}</span><em>T${i+1}</em></div>`).join('')}</div>
      <div style="height:20px"></div>
    </div>
    ${d.top&&d.top.length?`<div class="card"><h3>Bán chạy</h3><div class="tblwrap"><table><tbody>${d.top.map(x=>`<tr><td><b>${esc(x.code||'')}</b> ${esc(x.name||'')}</td><td class="money">${esc(x.qty??'')}</td></tr>`).join('')}</tbody></table></div></div>`:''}
    ${d.debtors&&d.debtors.length?`<div class="card"><h3>Khách đang nợ</h3><div class="tblwrap"><table><thead><tr><th>Khách</th><th class="money">Còn nợ</th></tr></thead><tbody>${d.debtors.map(c=>`<tr><td><b>${esc(c.code)}</b> — ${esc(c.name)}</td><td class="money bad"><b>${money(c.debt)}đ</b></td></tr>`).join('')}</tbody></table></div></div>`:''}
    ${d.short&&d.short.length?`<div class="card"><h3>⚠️ Màu/size cần đặt Taobao (đã bán quá tồn)</h3><div class="tblwrap"><table><thead><tr><th>Mã</th><th>Tên</th><th>Màu</th><th>Size</th><th class="money">Thiếu</th></tr></thead><tbody>${d.short.map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${esc(x.name||'')}</td><td>${esc(x.color||'')}</td><td>${esc(x.size||'')}</td><td class="money bad"><b>${Math.abs(num(x.qty))}</b></td></tr>`).join('')}</tbody></table></div></div>`:''}`;
  }catch(e){if(seq!==NAVSEQ)return;$('main').innerHTML=head('Tổng quan')+`<div class="card bad">Lỗi tải tổng quan: ${esc(e.message)}</div>`;}
}

/* ================= TAO DON ================= */
let CART=[]; // {code,color,size,qty}
function variantStock(code,color,size){const x=(D.stock||[]).find(s=>s.code===code&&s.color===color&&s.size===size);return x?num(x.qty):0;}
function pickVariant(code,preColor,preSize){
  const p=prodBy(code);if(!p)return;
  const vars=(D.stock||[]).filter(x=>x.code===code);
  const colors=[...new Set([...vars.map(x=>x.color),...(D.colors||[])])].filter(Boolean);
  const sizes=[...new Set([...vars.map(x=>x.size),...(D.sizes||[])])].filter(Boolean);
  let selC=preColor||'',selS=preSize||'';
  openModal(mHead(p.code+' — '+p.name)+`
    ${p.img?`<img src="${esc(p.img)}" referrerpolicy="no-referrer" style="width:100%;max-height:210px;object-fit:cover;border-radius:12px;margin-bottom:10px">`:''}
    <div class="row" style="margin-bottom:4px"><div>Giá bán<br><b style="font-size:17px">${money(p.price)}đ</b></div><div>Tồn tổng<br><b style="font-size:17px;color:${num(p.stock)<0?'var(--bad)':'var(--ok)'}">${p.stock} cái</b></div></div>

function renderCart(){
  const box=$('cartBox');if(!box)return;
  const sub=CART.reduce((s,i)=>{const p=prodBy(i.code);return s+(p?num(p.price)*i.qty:0);},0);
  const disc=num(($('oDisc')||{}).value),paid=num(($('oPaid')||{}).value),total=sub-disc;
  box.innerHTML=CART.length?CART.map((i,ix)=>{const p=prodBy(i.code);return `<div class="cart-line">
    <div class="inf"><b>${esc(i.code)}</b> — ${esc(p?p.name:'')}<br><span class="mut">${esc(i.color||'—')} • ${esc(i.size||'—')} • ${money(p?p.price:0)}đ</span></div>
    <div class="qty"><button onclick="chQty(${ix},-1)">−</button><input value="${i.qty}" onchange="setQty(${ix},this.value)"><button onclick="chQty(${ix},1)">＋</button></div>
    <div class="money" style="min-width:86px"><b>${money((p?num(p.price):0)*i.qty)}đ</b></div>
    <button class="x" onclick="delLine(${ix})">✕</button></div>`;}).join('')
    :'<p class="mut" style="padding:10px 0">Giỏ trống — bấm vào sản phẩm bên trái để thêm.</p>';
  $('cSub').textContent=money(sub)+'đ';$('cTotal').textContent=money(total)+'đ';$('cRemain').textContent=money(Math.max(0,total-paid))+'đ';
}
function chQty(ix,d){CART[ix].qty=Math.max(1,CART[ix].qty+d);renderCart();}

function delLine(ix){CART.splice(ix,1);renderCart();}

let imgForCode='';
$('imgFile').onchange=()=>{
  const f=$('imgFile').files[0];if(!f||!imgForCode)return;
  const img=new Image();
  img.onload=()=>{const k=Math.min(1,800/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
    const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);
    rpc('saveProductImage',imgForCode,cv.toDataURL('image/jpeg',0.85)).then(async()=>{toast('Đã lưu ảnh cho '+imgForCode,true);await refreshInit();pgProds();}).catch(e=>toast('Không lưu được ảnh: '+e.message,false));};
  img.src=URL.createObjectURL(f);};
async function delProd(code){

  const render=()=>{const q=norm($('cuQ').value);
    const list=D.customers.filter(c=>!q||norm([c.code,c.name,c.phone].join(' ')).includes(q));
    $('cuList').innerHTML=list.length?list.map(c=>`<div class="cart-line">
      <div class="inf"><b>${esc(c.code)}</b> — ${esc(c.name)}<br><span class="mut">${esc(c.phone||'chưa có SĐT')} • ${esc(c.group||'')} • đã mua ${money(c.total||0)}đ${num(c.debt)>0?` • <b class="bad">nợ ${money(c.debt)}đ</b>`:''}</span></div>
      <button class="btn-ghost" onclick="custDetail('${esc(c.code)}')">Xem</button>
      <button class="btn-ghost" onclick="custForm(custByCode('${esc(c.code)}'))">Sửa</button>
      <button class="btn-red" onclick="delCust('${esc(c.code)}')">Xoá</button></div>`).join('')
      :'<p class="mut">Không tìm thấy khách.</p>';};
  render();$('cuQ').oninput=render;
}
async function delCust(code){
  if(!confirm('Xoá khách '+code+'? (Chỉ xoá được khi khách chưa có đơn nào.)'))return;
  try{await rpc('deleteCustomer',code);toast('Đã xoá khách '+code,true);await refreshInit();pgCusts();}
  catch(e){toast('Không xoá được: '+e.message,false);}
}
function custForm(c){
  const isNew=!c;c=c||{group:'Khách lẻ'};
  openModal(mHead(isNew?'Thêm khách hàng':'Sửa khách '+c.code)+`
  <div class="row"><div><label>Mã KH ${isNew?'(admin tự đặt *)':'(không sửa được)'}</label><input id="cfCode" value="${esc(c.code||'')}" ${isNew?'':'disabled'} placeholder="vd: ngocmaihn"></div>
  <div style="flex:2"><label>Tên khách *</label><input id="cfName" value="${esc(c.name||'')}"></div></div>
  <div class="row" style="margin-top:8px"><div><label>SĐT / Zalo</label><input id="cfPhone" value="${esc(c.phone||'')}"></div>
  <div><label>Nhóm khách</label><select id="cfGroup">${['Khách lẻ','Khách sỉ','Cộng tác viên'].map(g=>`<option ${c.group===g?'selected':''}>${g}</option>`).join('')}</select></div></div>
  <div style="margin-top:8px"><label>Địa chỉ</label><input id="cfAddr" value="${esc(c.address||'')}"></div>
  <div style="margin-top:8px"><label>Link Facebook</label><input id="cfFb" value="${esc(c.facebook||'')}"></div>
  <button class="btn" id="cfSave" style="width:100%;margin-top:14px">✔ Lưu khách</button>`);
  $('cfSave').onclick=async()=>{
    const o={name:$('cfName').value.trim(),phone:$('cfPhone').value.trim(),group:$('cfGroup').value,address:$('cfAddr').value.trim(),facebook:$('cfFb').value.trim()};
    if(!o.name)return toast('Nhập tên khách',false);
    if(isNew){const code=$('cfCode').value.trim();
      if(!code)return toast('Khách mới: phải tự đặt Mã KH (yêu cầu của shop)',false);
      if(/\s/.test(code))return toast('Mã KH không được có khoảng trắng',false);
      if(D.customers.some(x=>x.code.toLowerCase()===code.toLowerCase()))return toast('Mã KH "'+code+'" đã có',false);
      o.newCode=code;}
    else o.code=c.code;
    try{const r=await rpc('saveCustomer',o);toast('Đã lưu khách '+r.code,true);closeModal();await refreshInit();pgCusts();}
    catch(e){toast('Lỗi: '+e.message,false);}
  };
}
async function custDetail(code){
  const s0=NAVSEQ;
  const c=custByCode(code);
  openModal(mHead(code+' — '+(c?c.name:''))+'<p class="mut">Đang tải lịch sử…</p>',true);
  try{const r=await rpc('getCustomerDetail',code);if(s0!==NAVSEQ)return;const orders=r.orders||r.history||[];
    openModal(mHead(code+' — '+(c?c.name:''))+`
    <p>${esc(c?c.phone:'')} • ${esc(c?c.group:'')} ${c&&num(c.debt)>0?`• <b class="bad">Đang nợ ${money(c.debt)}đ</b>`:''}</p>
    ${orders.length?orders.map(o=>`<div style="border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px">
      <div style="display:flex;gap:8px;flex-wrap:wrap"><b>${esc(o.code)}</b><span class="mut">${esc(o.date||'')}</span>${o.status?`<span class="badge b-xl">${esc(o.status)}</span>`:''}
      <span style="margin-left:auto"><button class="btn-ghost" data-cpdf="${esc(o.code)}" style="padding:5px 10px">Phiếu</button></span></div>
      ${(o.lines||[]).map(l=>`<div style="display:flex;justify-content:space-between;gap:8px;margin-top:4px"><span>${esc(l.desc||l.name||l.code||'')}</span><span class="money">${l.amount!=null?money(l.amount):''}</span></div>`).join('')}
      <div style="display:flex;gap:14px;justify-content:flex-end;margin-top:6px"><span>Tổng <b>${money(o.total)}</b></span><span>Đã thu ${money(o.paid)}</span>${num(o.debt)>0?`<span class="bad">Nợ ${money(o.debt)}</span>`:''}</div>
    </div>`).join(''):'<p class="mut" style="margin-top:10px">Khách chưa có đơn nào.</p>'}`,true);
    document.querySelectorAll('[data-cpdf]').forEach(b=>b.onclick=async()=>{
      try{const r=await rpc('exportOrderPdf',b.dataset.cpdf);showBill(r,'PHIẾU ĐƠN HÀNG');}
      catch(e){toast('Không mở được phiếu: '+e.message,false);}});
  }catch(e){if(s0!==NAVSEQ)return;openModal(mHead('Khách '+code)+`<p class="bad">Lỗi: ${esc(e.message)}</p>`);}
}
</script>
